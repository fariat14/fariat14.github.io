name: Rewrite project card copy

on:
  push:
    paths:
      - '.github/workflows/rewrite-project-copy.yml'

permissions:
  contents: write

jobs:
  rewrite-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make project cards recruiter-friendly and consistent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()

          replacements = {
            'Audited a year of Google Analytics data (903K sessions) in BigQuery. The default report showed Referral as the top channel at 5.29% conversion, but 95% of its revenue had no referring site. After reclassifying those sessions, real Referral converts at 0.54%, and untracked traffic turns out to be 38% of all revenue.':
            'Audited 903K Google Analytics sessions in BigQuery and rebuilt channel attribution logic in SQL. Reclassification cut apparent Referral conversion from 5.29% to 0.54% and revealed that untracked traffic accounted for 38% of revenue.',

            'Predictions locked July 14, before the semifinals.':
            'How well can historical match data predict World Cup outcomes?',

            'Replayed historical international matches to build Elo ratings, estimated match probabilities with logistic regression, and documented evaluation and limitations.':
            'Replayed 49,505 international matches from 1872 onward to build Elo ratings, then trained logistic regression using Elo gap, recent form, and home advantage. On a time-based post-2022 test set of 3,597 matches, the model reached 78.3% accuracy and powered 500,000 Monte Carlo tournament simulations.',

            'Compared 11 classification models on 7,043 telecom customers and selected a well-calibrated logistic regression with 0.849 test ROC-AUC. Then moved beyond churn prediction to customer-level decisioning: expected-value targeting produced about $5,600 in simulated campaign profit versus about $600 from ranking customers by churn risk alone under the base assumptions.':
            'Compared 11 classifiers on 7,043 IBM Telco customers and selected a calibrated logistic regression with 0.849 test ROC-AUC and 80.7% accuracy. Expected-value targeting increased simulated retention profit from about $600 to $5,600 versus ranking customers by churn risk alone.',

            'Which firm capabilities are associated with innovation?':
            'Which firm capabilities are most predictive of innovation?',

            'Applied machine learning to World Bank Enterprise Survey data to examine how firm characteristics relate to innovation in Bangladesh. The repository documents the method and findings.':
            'Modeled 3,382 firms across the 2013, 2016, and 2022 World Bank Enterprise Survey waves with a tuned Random Forest classifier. Combined-innovation ROC-AUC reached ~0.83; worker training, R&amp;D spending, quality certification, technology adoption, and institutional efficiency emerged as leading predictors.'
          }

          missing = [old for old in replacements if old not in text]
          if missing:
              raise SystemExit('Missing expected project copy: ' + ' | '.join(missing))

          for old, new in replacements.items():
              text = text.replace(old, new, 1)

          p.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make project cards recruiter-friendly and consistent"
          git push
