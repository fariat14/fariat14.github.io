name: Standardize project links

on:
  push:
    paths:
      - '.github/workflows/standardize-project-links.yml'

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize GitHub link labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          replacements = {
              '>Read project documentation</a>': '>GitHub</a>',
              '>Read project and code</a>': '>GitHub</a>',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Standardize project GitHub link labels"
          git push
