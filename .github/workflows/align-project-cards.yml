name: Align project card spacing

on:
  push:
    paths:
      - '.github/workflows/align-project-cards.yml'

permissions:
  contents: write

jobs:
  align-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add project card alignment CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          marker = '</style>'
          css = '''
          /* Align comparable content across side-by-side project cards */
          @media(min-width:851px){
            #projects .project-card{display:flex;flex-direction:column}
            #projects .project-card .meta{min-height:38px}
            #projects .project-card h3{min-height:64px;margin-bottom:12px}
            #projects .project-card .project-question{min-height:56px;margin:10px 0 16px}
            #projects .project-card>p:not(.meta):not(.project-question):not(.note){min-height:165px}
            #projects .project-card .stack{min-height:92px;align-content:flex-start}
            #projects .project-card .text-link{align-self:flex-start}
          }
          '''
          if 'Align comparable content across side-by-side project cards' not in text:
              if marker not in text:
                  raise SystemExit('style end marker not found')
              text = text.replace(marker, css + marker, 1)
              p.write_text(text)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align project card spacing"
          git push
